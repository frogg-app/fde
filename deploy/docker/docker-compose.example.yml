# Minimal FDE daemon + web UI deployment.
#
# Open http://<host>:9999 after `docker compose up -d`.
# For any network-reachable deployment, change PASEO_PASSWORD first.
# Pin the exact image version so a redeploy is reproducible.
services:
  fde:
    image: froggapp/fde:0.1.6
    container_name: fde-daemon
    restart: unless-stopped
    ports:
      - "0.0.0.0:9999:9999"
    environment:
      PASEO_PASSWORD: "change-me"
      # Add DNS names you use to reach this container. IPs and localhost are
      # already allowed by default.
      # PASEO_HOSTNAMES: "fde.example.com,.lan"
    volumes:
      # Persistent daemon state (agents, config, pairing).
      - ./fde-home:/home/fde/.paseo
      # Code visible to the daemon and the agents it launches.
      - ./workspace:/workspace
