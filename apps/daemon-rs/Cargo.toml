[package]
name = "fde-daemon"
version = "0.1.19"
description = "FDE daemon (Rust) — protocol-compatible front half of the FDE daemon"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.77.2"

[[bin]]
name = "fde-daemond"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "net",
  "io-util",
  "signal",
  "time",
  "sync",
  "process",
] }
tokio-tungstenite = "0.24"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.6", features = ["fs", "set-header"] }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "tokio"] }
http-body-util = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
subtle = "2"
bcrypt = "0.15"
portable-pty = "0.8"
vt100 = "0.15"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
# unwind (not abort) on purpose: a panic in one connection task must not take
# down the daemon. Stability over the last few KB of binary size.
panic = "unwind"
