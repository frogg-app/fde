[package]
name = "fde"
version = "0.1.19"
description = "FDE (Frogg Development Environment) desktop shell"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.77.2"

[lib]
name = "fde_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "fde"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
url = "2"
percent-encoding = "2"
tauri-plugin-dialog = "2.7"
tauri-plugin-notification = "2.4"
tauri-plugin-opener = "2.5"
tauri-plugin-os = "2.3"
tauri-plugin-updater = "2.11"
tauri-plugin-window-state = "2.4"
tauri-plugin-single-instance = { version = "2.4", features = ["deep-link"] }
tauri-plugin-deep-link = "2.4"
log = { version = "0.4", features = ["std"] }
glob = "0.3"
tokio = { version = "1", features = [
  "rt-multi-thread",
  "net",
  "process",
  "io-util",
  "sync",
  "time",
  "macros",
  "fs",
] }
tokio-tungstenite = "0.30"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# Sidecar daemon bundle: download, verify, extract (src/sidecar/).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
sha2 = "0.10"
# App updates from GitHub releases (src/updates/).
semver = "1"
flate2 = "1"
tar = "0.4"
zip = { version = "8", default-features = false, features = ["deflate"] }
if-addrs = "0.15.0"
dns-lookup = "4.0.1"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
