version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Pinned by the Expo SDK / root overrides; bump them deliberately.
      - dependency-name: react
      - dependency-name: react-dom
      - dependency-name: react-native
      - dependency-name: react-native-reanimated
      - dependency-name: react-native-worklets
      - dependency-name: expo*
      - dependency-name: "@react-native/*"
      - dependency-name: "@react-native-community/*"
      # Native modules whose supported range tracks the RN/Expo version above.
      # Grouping them with ordinary patches makes the whole batch unmergeable.
      - dependency-name: "@shopify/react-native-skia"
      - dependency-name: react-native-screens
      - dependency-name: react-native-safe-area-context
      - dependency-name: react-native-nitro-modules
      - dependency-name: react-native-keyboard-controller
      - dependency-name: react-native-unistyles

  - package-ecosystem: cargo
    directory: /apps/desktop/src-tauri
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
