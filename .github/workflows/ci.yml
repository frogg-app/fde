name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # CI never uses the CUDA execution provider; the onnxruntime-node postinstall
  # download is large enough to make `npm ci` flaky.
  ONNXRUNTIME_NODE_INSTALL: skip
  CI: "true"
  LEFTHOOK: "0"

jobs:
  checks:
    name: format, lint, typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-node-deps

      - name: Check formatting
        run: npx oxfmt --check .

      - name: Lint
        run: npx oxlint .

      - name: Script tests
        run: npm run test:scripts

      # Workspaces typecheck against each other's dist/ output, so the server stack
      # (protocol, client, highlight, relay, server, cli) is built first.
      - name: Build server stack
        run: npm run build:server

      - name: Build native audio declarations
        run: npm run build --workspace=@fde/expo-two-way-audio

      - name: Typecheck
        run: npm run typecheck

  tests:
    name: unit tests (libraries, cli)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-deps

      - name: Build library dependencies
        # The CLI unit tests import @fde/server (the claim and self-update commands), so the
        # server and CLI dists have to exist too, not just the shared libraries.
        run: npm run build:server

      - name: Test protocol, client, highlight, relay
        run: >-
          npm run test
          --workspace=@fde/protocol
          --workspace=@fde/client
          --workspace=@fde/highlight
          --workspace=@fde/relay

      - name: Test cli (unit)
        run: npm run test:unit --workspace=@fde/cli

  ui-tests:
    # The ui suite is the longest job in the pipeline, and its two vitest
    # projects have different needs: `unit` is 597 files of plain node tests,
    # `browser` is 11 files that need a Chromium download. Splitting them keeps
    # the Playwright install off the shards, and sharding the rest turns a
    # single long job into three short ones.
    name: unit tests (ui) ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-deps

      - name: Build library dependencies
        # Deps only: the ui imports @fde/client and @fde/protocol but never
        # @fde/server, and the CLI tests that did moved to their own job.
        run: npm run build:server-deps && npm run build --workspace=@fde/expo-two-way-audio

      - name: Test ui (unit)
        run: >-
          npx vitest run --root apps/ui --project unit
          --shard=${{ matrix.shard }}/3

  ui-browser-tests:
    name: browser tests (ui)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-deps

      - name: Install Playwright Chromium
        timeout-minutes: 10
        run: npx playwright install --with-deps chromium

      - name: Build library dependencies
        run: npm run build:server-deps && npm run build --workspace=@fde/expo-two-way-audio

      - name: Test ui (browser)
        run: npx vitest run --root apps/ui --project browser

  server-tests:
    name: unit tests (server) ${{ matrix.shard }}/5
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # Five, not three. vitest shards by file count rather than duration, and
        # the server's slow files clustered in shard 1 - it ran 272s against the
        # others' 149s, making it the whole pipeline's critical path. More,
        # smaller shards blunt that imbalance without needing to know which
        # files are slow.
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v7
        with:
          # Worktree tests compare against origin/main.
          fetch-depth: 0

      - uses: ./.github/actions/setup-node-deps

      - name: Build server dependencies
        run: npm run build:server-deps

      - name: Test server (unit, no e2e)
        run: npx vitest run --root packages/server --fileParallelism --exclude "**/*.e2e.test.ts" --shard=${{ matrix.shard }}/5

  builds:
    name: Selected clients and daemon
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/build-selected.yml
