name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # CI never uses the CUDA execution provider; the onnxruntime-node postinstall
  # download is large enough to make `npm ci` flaky.
  ONNXRUNTIME_NODE_INSTALL: skip
  CI: "true"
  LEFTHOOK: "0"

jobs:
  checks:
    name: format, lint, typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: node scripts/ci/npm-retry.mjs ci

      - name: Check formatting
        run: npx oxfmt --check .

      - name: Lint
        run: npx oxlint .

      - name: Script tests
        run: npm run test:scripts

      # Workspaces typecheck against each other's dist/ output, so the server stack
      # (protocol, client, highlight, plugin, relay, server, cli) is built first.
      - name: Build server stack
        run: npm run build:server

      - name: Typecheck
        run: npm run typecheck

  tests:
    name: unit tests (libraries, ui, cli)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: node scripts/ci/npm-retry.mjs ci

      - name: Install Playwright Chromium (ui browser project)
        timeout-minutes: 10
        run: npx playwright install --with-deps chromium

      - name: Build library dependencies
        # The CLI unit tests import @fde/server (the claim and self-update commands), so the
        # server and CLI dists have to exist too, not just the shared libraries.
        run: npm run build:server && npm run build --workspace=@fde/expo-two-way-audio

      - name: Test protocol, client, highlight, relay, plugin
        run: >-
          npm run test
          --workspace=@fde/protocol
          --workspace=@fde/client
          --workspace=@fde/highlight
          --workspace=@fde/relay
          --workspace=@fde/plugin

      - name: Test cli (unit)
        run: npm run test:unit --workspace=@fde/cli

      - name: Test ui
        run: npm run test --workspace=@fde/app

  server-tests:
    name: unit tests (server)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          # Worktree tests compare against origin/main.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: node scripts/ci/npm-retry.mjs ci

      - name: Build server dependencies
        run: npm run build:server-deps

      - name: Test server (unit, no e2e)
        run: npm run test:unit --workspace=@fde/server

  desktop:
    name: desktop (linux deb)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf build-essential curl wget file libssl-dev libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install dependencies
        run: node scripts/ci/npm-retry.mjs ci

      - name: Build web UI
        run: npm run build:ui

      - name: Desktop tests (bridge bundle + cargo test)
        run: npm run test --workspace=@fde/desktop

      # The npm-distributed Tauri CLI is a prebuilt binary, so this is much faster
      # than `cargo install tauri-cli` and needs no extra cache.
      - name: Build Linux deb
        working-directory: apps/desktop
        run: npx --yes @tauri-apps/cli@^2 build --bundles deb

      - name: Upload deb
        uses: actions/upload-artifact@v7
        with:
          name: fde-linux-deb
          path: apps/desktop/src-tauri/target/release/bundle/deb/*.deb
          retention-days: 7
          if-no-files-found: error

  android:
    name: android (debug apk)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Free disk space (Android SDK + NDK + node_modules need it)
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false
      - name: Trim the Android SDK to what the build needs
        run: |
          sudo rm -rf /usr/local/lib/android/sdk/ndk /usr/local/lib/android/sdk/emulator /usr/local/lib/android/sdk/system-images || true
          df -h /

      # The Android build is the slowest job, so it only runs when something it
      # depends on changed. Pushes to main always run it.
      - uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            android:
              - "apps/ui/**"
              - "packages/expo-two-way-audio/**"
              - "scripts/release/build-android-apk.mjs"
              - "package.json"
              - "package-lock.json"
              - ".github/workflows/ci.yml"

      - uses: actions/setup-node@v7
        if: steps.changes.outputs.android == 'true' || github.event_name != 'pull_request'
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-java@v6
        if: steps.changes.outputs.android == 'true' || github.event_name != 'pull_request'
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4
        if: steps.changes.outputs.android == 'true' || github.event_name != 'pull_request'
        with:
          log-accepted-android-sdk-licenses: false

      - uses: gradle/actions/setup-gradle@v6
        if: steps.changes.outputs.android == 'true' || github.event_name != 'pull_request'

      - name: Install dependencies
        if: steps.changes.outputs.android == 'true' || github.event_name != 'pull_request'
        run: node scripts/ci/npm-retry.mjs ci

      # Debug variant: prebuild + assembleDebug, no JS bundle, no keystore.
      - name: Prebuild and assemble debug APK
        if: steps.changes.outputs.android == 'true' || github.event_name != 'pull_request'
        run: node scripts/release/build-android-apk.mjs --variant debug --abi arm64-v8a --out-dir ci-assets

      - uses: actions/upload-artifact@v7
        if: steps.changes.outputs.android == 'true' || github.event_name != 'pull_request'
        with:
          name: fde-android-debug-apk
          path: ci-assets/*.apk
          retention-days: 7
          if-no-files-found: error
