name: Electron desktop
on:
  workflow_dispatch:
  pull_request:
    paths:
      - apps/desktop-electron/**
      - apps/ui/**
      - packages/**
      - scripts/dev/electron-dev*.mjs
      - scripts/release/build-electron.mjs
      - package-lock.json
      - .github/workflows/electron-desktop.yml
permissions:
  contents: read
concurrency:
  group: electron-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run install:electron --workspace=@frogg/desktop-electron
      - run: npm run build:app-deps
      - run: npm run typecheck --workspace=@frogg/desktop-electron
      - run: npm run test --workspace=@frogg/desktop-electron
      - run: npm run build:desktop:electron -- --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: electron-${{ matrix.target }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            apps/desktop-electron/release/SHA256SUMS
            apps/desktop-electron/release/*.exe
            apps/desktop-electron/release/*.zip
