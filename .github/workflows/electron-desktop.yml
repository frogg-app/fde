name: Electron desktop
on:
  workflow_dispatch:
  pull_request:
    paths:
      - apps/desktop-electron/**
      - apps/ui/**
      - packages/**
      - scripts/dev/electron-dev*.mjs
      - scripts/release/build-electron.mjs
      - package-lock.json
      - .github/workflows/electron-desktop.yml
permissions:
  contents: read
concurrency:
  group: electron-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-x64
          - os: windows-latest
            target: win-x64
          - os: macos-15
            target: darwin-arm64
          - os: macos-15-intel
            target: darwin-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run install:electron --workspace=@fde/desktop-electron
      - run: npm run build:app-deps
      - run: npm run typecheck --workspace=@fde/desktop-electron
      - run: npm run test --workspace=@fde/desktop-electron
      - run: npm run build:desktop:electron -- --target ${{ matrix.target }}
      - name: Smoke Electron startup and relaunch
        if: runner.os == 'Linux'
        run: |
          binary=$(node -p "require('./.generated/branding/brand.json').id")
          FDE_ELECTRON_SMOKE_EXECUTABLE="$PWD/apps/desktop-electron/release/linux-unpacked/$binary" \
            xvfb-run -a npm run test:smoke --workspace=@fde/desktop-electron
        env:
          FDE_ELECTRON_SMOKE_NO_SANDBOX: "1"
          FDE_ELECTRON_SMOKE_OUTPUT: ${{ github.workspace }}/.dev/electron-smoke
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Linux'
        with:
          name: electron-smoke-${{ github.sha }}
          path: .dev/electron-smoke/
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: electron-${{ matrix.target }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            apps/desktop-electron/release/SHA256SUMS
            apps/desktop-electron/release/*.exe
            apps/desktop-electron/release/*.zip
            apps/desktop-electron/release/*.dmg
            apps/desktop-electron/release/*.AppImage
            apps/desktop-electron/release/*.deb
            apps/desktop-electron/release/*.tar.gz
