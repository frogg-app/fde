name: Website

# frogg.app landing page + docs (website/, a standalone npm project).
on:
  pull_request:
    paths:
      - "website/**"
      - ".github/workflows/website.yml"
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/website.yml"
  workflow_dispatch:

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CI: "true"
  LEFTHOOK: "0"

defaults:
  run:
    working-directory: website

jobs:
  build:
    name: build and link check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install
        run: npm ci

      - name: Type and content check
        run: npx astro check

      - name: Build
        run: npm run build

      - name: Link check
        run: npm run linkcheck

      - uses: actions/upload-artifact@v7
        with:
          name: website-dist
          path: website/dist
          retention-days: 7

  deploy:
    name: deploy to Cloudflare
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: website-deploy
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check for Cloudflare credentials
        id: creds
        working-directory: ${{ github.workspace }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::warning title=Website not deployed::CLOUDFLARE_API_TOKEN secret is not set; skipping deploy."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.creds.outputs.present == 'true'

      - uses: actions/setup-node@v7
        if: steps.creds.outputs.present == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - uses: actions/download-artifact@v8
        if: steps.creds.outputs.present == 'true'
        with:
          name: website-dist
          path: website/dist

      - name: Install
        if: steps.creds.outputs.present == 'true'
        run: npm ci

      # Deploys the workers.dev preview. Switch to `--env production` once the
      # frogg.app routes in website/wrangler.toml are enabled.
      - name: Deploy
        if: steps.creds.outputs.present == 'true'
        run: npx wrangler deploy
