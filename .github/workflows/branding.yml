name: Branding acceptance
on:
  pull_request:
    paths:
      - "brands/**"
      - "packages/branding/**"
      - "scripts/dev/brand*"
      - "scripts/dev/branding/**"
      - "scripts/release/**"
      - "scripts/ci/branding*"
      - "apps/desktop-electron/**"
      - "apps/ui/app.config.js"
      - "deploy/**"
      - ".github/**"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: branding-${{ github.ref }}
  cancel-in-progress: false
env:
  ONNXRUNTIME_NODE_INSTALL: skip
  CI: "true"
  LEFTHOOK: "0"
jobs:
  web-and-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        brand: [brands/fde, brands/example]
    env:
      FDE_BRAND_DIR: ${{ matrix.brand }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node-deps
      - run: npm run brand:check
      - run: node scripts/ci/branding-acceptance.mjs
      - run: node scripts/ci/branding-contribution.mjs
        env:
          ALLOW_OFFICIAL_BRAND_CHANGE: ${{ contains(github.event.pull_request.labels.*.name, 'branding:official') && '1' || '0' }}
      - run: npm run build:server && npm run build:daemon-web-ui
      - run: npx playwright install --with-deps chromium
      - run: node scripts/ci/branding-browser.mjs
      - run: node scripts/release/build-daemon-bundle.mjs --target linux-x64 --out-dir dist/bundles
      - run: node --test scripts/ci/branding-install.test.mjs
      - run: npx vitest run src/server/orchestration-skills/internal/brand-ownership.test.ts --root packages/server
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: branding-runtime-${{ strategy.job-index }}
          path: |
            dist/bundles
            .generated/branding/brand.json
            .generated/branding/provenance.json
            .generated/browser
          include-hidden-files: true
          retention-days: 7
  desktop:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, windows-latest, macos-latest]
        brand: [brands/fde, brands/example]
    env:
      FDE_BRAND_DIR: ${{ matrix.brand }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-deps
      - run: npm run install:electron --workspace=@fde/desktop-electron
      - if: runner.os == 'Windows'
        name: Validate Windows development script
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'scripts/dev/dev.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { throw ($errors | Out-String) }
      - run: node --test scripts/dev/npm-command.test.mjs
      - run: npm run build:desktop
      - run: node scripts/ci/branding-package-inspect.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: branding-desktop-${{ strategy.job-index }}
          path: apps/desktop-electron/release
          retention-days: 7
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FDE_BRAND_DIR: brands/example
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-deps
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - run: node scripts/release/build-android-apk.mjs --variant debug --abi arm64-v8a
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: branding-android
          path: apps/ui/android/app/build/outputs/apk/**/*.apk
          retention-days: 7
  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      FDE_BRAND_DIR: brands/example
      APP_VARIANT: development
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-deps
      - run: npm run build:app-deps
      - working-directory: apps/ui
        run: npx expo prebuild --platform ios --clean --non-interactive
      - name: Build unsigned simulator app
        working-directory: apps/ui
        shell: bash
        run: |
          workspace=$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)
          scheme=$(xcodebuild -list -json -workspace "$workspace" | node -e 'let s="";process.stdin.on("data",c=>s+=c);process.stdin.on("end",()=>process.stdout.write(JSON.parse(s).workspace.schemes[0]))')
          xcodebuild -workspace "$workspace" -scheme "$scheme" -sdk iphonesimulator -configuration Debug -derivedDataPath ios/build CODE_SIGNING_ALLOWED=NO build
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: branding-ios-simulator
          path: apps/ui/ios/build/Build/Products/Debug-iphonesimulator/*.app
          retention-days: 7
  selected-distribution:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/select-brand
        with:
          directory: ${{ vars.FDE_BRAND_DIR }}
          repository: ${{ vars.FDE_BRAND_REPOSITORY }}
          revision: ${{ vars.FDE_BRAND_REVISION }}
          subdirectory: ${{ vars.FDE_BRAND_SUBDIR }}
          token: ${{ secrets.BRANDING_READ_TOKEN }}
      - uses: ./.github/actions/setup-node-deps
      - run: npm run brand:check && npm run build:ui

  runtime-isolation:
    needs: web-and-runtime
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/download-artifact@v8
        with:
          name: branding-runtime-0
          path: .generated/isolation-fde
      - uses: actions/download-artifact@v8
        with:
          name: branding-runtime-1
          path: .generated/isolation-custom
      - run: node scripts/ci/branding-runtime-isolation.mjs --fde .generated/isolation-fde/dist/bundles/fde-daemon-*-linux-x64.tar.gz --custom .generated/isolation-custom/dist/bundles/acme-daemon-*-linux-x64.tar.gz
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: branding-runtime-isolation
          path: .generated/runtime-isolation
          include-hidden-files: true
          retention-days: 7
  nix:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - run: docker run --rm --cpus 2 --memory 6g -v "$PWD:/work" -w /work nixos/nix:2.31.2 sh scripts/ci/branding-nix.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: branding-nix
          path: .generated/nix-acceptance
          include-hidden-files: true
          retention-days: 7
