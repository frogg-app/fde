name = "frogg-relay"
account_id = "10ed39a1dbf316e30abd0c409bed40d6"
main = "src/cloudflare-adapter.ts"
compatibility_date = "2024-12-01"

# Inherited deployment template; configure your own domain before manual deployment.
routes = [{ pattern = "relay.example.com", custom_domain = true }]

[observability]
enabled = true

[vars]
# Optional proxy destination. Empty uses this package's own relay implementation.
FROGG_RELAY_UPSTREAM = ""

[[durable_objects.bindings]]
name = "RELAY"
class_name = "RelayDurableObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RelayDurableObject"]
